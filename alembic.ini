# Alembic config. The database is not set here: `migrations/env.py` takes the database of the selected profile
# (`ProjectDirs.data_base_file`), the same as the application does.
# Конфигурация Alembic. База данных здесь не задана: `migrations/env.py` берет базу выбранного профиля
# (`ProjectDirs.data_base_file`), как и приложение.
#
# A new migration after a change of the models (PowerShell, the profile is chosen by the environment variable):
# Новая миграция после изменения моделей (PowerShell, профиль выбирается переменной окружения):
#   $env:TELEGRAM_SAVER_PROFILE='<profile>'; alembic revision --autogenerate -m "short description"
# The application applies the migrations itself at the start (see `schema_migrations.py`).
# Приложение применяет миграции само при старте (см. `schema_migrations.py`).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
